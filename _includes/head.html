<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% if page.title %}{{ page.title }} &mdash; {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | truncate: 200 }}">
{%- comment -%}
Blocking, inline, and BEFORE the stylesheet: this is what stops a light-mode flash on a
dark-mode machine. Moving it to an external file or below the CSS link reintroduces the
flash, because the first paint would happen before the attribute is set.
{%- endcomment -%}
<script>
/* Default is DARK: this site shares ECGBench's design, and ECGBench is a dark site. Light
   (the paper palette) and auto (follow the OS) remain one click away on the toggle. */
(function(){try{var m=localStorage.getItem('deepecg-theme')||'dark';var r=document.documentElement;
if(m==='light'||m==='dark'){r.setAttribute('data-theme',m);r.setAttribute('data-theme-source','user');}
else{r.setAttribute('data-theme-source','system');}}catch(e){r.setAttribute('data-theme','dark');}})();
</script>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/generated/tokens.css' | relative_url }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#128147;</text></svg>">
