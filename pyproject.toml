[project]
name = "deepecg-kit-bench-tools"
version = "0.2.0"
description = "Data tooling and tests for the DeepECG-Bench page."
requires-python = ">=3.10"
# Deliberately empty: the tools are standard library only. tools/export_registry.py is the
# one exception, and it runs inside the kit's own environment (see `make registry`), never
# on the deploy path. A tool with no dependencies is a tool that still runs in three years.
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
pythonpath = ["tools"]
