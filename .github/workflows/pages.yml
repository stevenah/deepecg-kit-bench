name: Test and deploy

# site/ is published exactly as committed: there is no build. The only thing between a
# push and the public page is the test job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Node only runs the page-logic tests. 22, because site/app.js is an ES module with
      # a .js name and no package.json, which older versions refuse to import.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Includes the browser smoke test, which uses the runner's own Chrome.
      - name: Data, tool, style and browser tests
        run: uv run pytest -q

      - name: Page-logic tests
        run: node --test tools/tests/app.test.mjs

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
