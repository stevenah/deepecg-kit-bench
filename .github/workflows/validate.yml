name: Validate

# The PR gate. Same checks as the deploy build, plus the tool tests, and NO deploy job.
#
# Deliberately not in the `pages` concurrency group: sharing it would let a pull-request
# build queue ahead of a production deploy, so a busy PR day would delay publishing.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Integrity gates
        run: uv run --no-project --with pyyaml python tools/validate.py --strict

      - name: Tool tests
        run: uv run --no-project --with pyyaml --with pytest python -m pytest tools/tests -q

      - name: Build site data
        run: uv run --no-project --with pyyaml python tools/build_site_data.py

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Jekyll build
        run: bundle exec jekyll build --trace

      - name: Check internal links
        run: uv run --no-project --with pyyaml python tools/check_links.py _site --fail-on-404
