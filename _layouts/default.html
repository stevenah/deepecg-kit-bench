<!DOCTYPE html>
<html lang="en">
<head>{% include head.html %}</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{% include nav.html %}
<main id="main">{{ content }}</main>
{% include footer.html %}
{%- assign asset_v = site.time | date: '%s' %}
<script src="{{ '/assets/js/theme.js' | relative_url }}?v={{ asset_v }}"></script>
<script src="{{ '/assets/js/age.js' | relative_url }}?v={{ asset_v }}"></script>
{% if page.needs_filter %}<script src="{{ '/assets/js/filter.js' | relative_url }}?v={{ asset_v }}"></script>{% endif %}
</body>
</html>
