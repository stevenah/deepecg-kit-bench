# Defects that are known to affect committed numbers. Joined on (kit_version, dataset)
# by tools/build_site_data.py and rendered as a per-cell chip plus a task-page banner.
#
# This exists because every validation gate in this repo checks CONSISTENCY, not
# CORRECTNESS: the site can render a wrong number wrapped in a perfect provenance
# record. These entries are the only mechanism that says so on the page.
- id: ltafdb-memmap-truncation
  datasets: [ltafdb]
  kit_version_max: "0.2.0"
  severity: high
  summary: "LTAFDB signals were read from a silently truncated memmap."
  detail: >
    Results produced by deepecgkit <= 0.2.0 on LTAFDB were computed over a truncated
    view of each record. See the deepecg-kit CHANGELOG, [Unreleased] > Fixed. Any
    LTAFDB number from an affected snapshot should be treated as invalid, not merely
    imprecise.

- id: unified-af-split-suspect
  datasets: [unified-af]
  kit_version_max: "0.2.0"
  severity: high
  summary: "Accuracy and MCC are implausibly high relative to macro-F1; the split may leak."
  detail: >
    On unified-af, convnext-v2 records accuracy 0.9985, MCC 0.9840 and AUROC 0.9997
    against a macro-F1 of 0.8646. An accuracy/MCC pair that high beside a macro-F1 that
    low is the signature of a leaking or catastrophically imbalanced split rather than a
    strong model. unified-af is marked scope: exploratory until a grouped-split audit
    lands in the library. Do not cite these numbers.
