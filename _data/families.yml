# Architecture families. The SITE is the sole authority for this field: the library
# records no family, and docs/user-guide/model-zoo.md upstream carries a different,
# incompatible taxonomy that Phase 6 retires in favour of this one.
cnn:
  label: "Convolutional"
  order: 1
  blurb: "Feed-forward convolutional trunks, including residual and inception variants."
rnn:
  label: "Recurrent"
  order: 2
  blurb: "Recurrent sequence models over the raw or downsampled signal."
hybrid:
  label: "Hybrid"
  order: 3
  blurb: "Convolutional feature extraction followed by a recurrent or attention aggregator."
attention:
  label: "Attention"
  order: 4
  blurb: "Transformer-family encoders operating on patches or timesteps."
ssm:
  label: "State-space"
  order: 5
  blurb: "Structured state-space sequence models with sub-quadratic mixing."
foundation:
  label: "Foundation / SSL"
  order: 6
  blurb: "Self-supervised and foundation models pretrained on large ECG corpora."

# The two below name what the model OUTPUTS rather than its trunk, because filing a U-Net
# delineator or a diffusion generator under `cnn` would describe the layers and misdescribe
# the model. Both are field-survey only: DeepECG-Kit implements no such model, and neither
# can ever hold a result cell, since every task here is classification.
segmentation:
  label: "Delineation / detection"
  order: 7
  blurb: "Networks whose output is a positional map over samples: P/QRS/T delineation, R-peak detection, digitisation of printed ECG."
generative:
  label: "Generative / denoising"
  order: 8
  blurb: "Networks whose output is a signal: synthesis, imputation, denoising and baseline-wander removal."
