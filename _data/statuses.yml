# Cell statuses for the model x task universe.
#
# Every cell gets EXACTLY ONE of these. tools/build_site_data.py fails the build if any
# cell is unstatused. This is the machine-checked form of the journal's rule that
# "no cell may be left blank; each is either a measured value or an explicit status".
#
# Status is never conveyed by colour alone: `glyph` is mandatory and is rendered
# alongside every chip, for colour-blind and print readers.
#
# `bucket` names one of _data/buckets.yml, which is what the legend shows. Colour belongs
# to the bucket, so every status here repeats its bucket's colours and validate.py fails
# the build if the two ever drift apart. The glyph, not the colour, is what separates two
# statuses inside the same bucket.
measured:
  label: "Measured"
  bucket: kit
  glyph: "●"
  color_light: "#1B7F4B"
  color_dark: "#22c55e"
  shows_number: true
  blurb: "Value present with the task's full expected replicate count."
partial:
  label: "Partial"
  bucket: kit
  glyph: "◐"
  color_light: "#1B7F4B"
  color_dark: "#22c55e"
  shows_number: true
  blurb: "Value present, but from fewer replicates than the task expects."
non_convergent:
  label: "Non-convergent"
  bucket: kit
  glyph: "⚠"
  color_light: "#1B7F4B"
  color_dark: "#22c55e"
  shows_number: true
  blurb: "Run completed but failed the convergence criterion. The measured value is shown, not hidden."
convergence_unknown:
  label: "Convergence not reported"
  bucket: kit
  glyph: "○"
  color_light: "#1B7F4B"
  color_dark: "#22c55e"
  shows_number: true
  blurb: "Snapshot predates the convergence flag, so we cannot say whether this run converged."
reported:
  label: "Reported by paper"
  bucket: reported
  glyph: "◆"
  color_light: "#8A6D00"
  color_dark: "#facc15"
  shows_number: true
  blurb: "Value as published by the original authors, recorded in _data/reported.yml. Not measured here and not produced under this site's protocol."
not_run:
  label: "Not run"
  bucket: none
  glyph: "—"
  color_light: "#808A9E"
  color_dark: "#636B83"
  shows_number: false
  blurb: "This model x task pair has never been trained."
incomplete:
  label: "Incomplete"
  bucket: none
  glyph: "◑"
  color_light: "#808A9E"
  color_dark: "#636B83"
  shows_number: false
  blurb: "A run directory exists but produced no metrics file."
excluded_averaging:
  label: "Excluded (averaging)"
  bucket: none
  glyph: "⊘"
  color_light: "#808A9E"
  color_dark: "#636B83"
  shows_number: false
  blurb: "Dropped by reconcile_averaging because its averaging mode disagreed with its group."
metric_undefined:
  label: "Not defined"
  bucket: none
  glyph: "n/a"
  color_light: "#808A9E"
  color_dark: "#636B83"
  shows_number: false
  blurb: "This metric does not exist for this task's label shape."
metric_unimplemented:
  label: "Not implemented"
  bucket: none
  glyph: "··"
  color_light: "#808A9E"
  color_dark: "#636B83"
  shows_number: false
  blurb: "Specified by the journal protocol but not yet computed by deepecgkit."
