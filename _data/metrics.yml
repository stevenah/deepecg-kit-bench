# Metric vocabulary. Mirrors deepecgkit exactly:
#   vocabulary        <- aggregation.SINGLE_LABEL_METRICS / MULTI_LABEL_METRICS
#   direction: lower  <- latex.LOWER_IS_BETTER
#   label             <- latex.METRIC_DISPLAY_NAMES (de-LaTeX-ed)
#
# `direction` gates every sort. A metric with direction "none" is displayed but never
# sorted and never ranked -- without this, a naive descending sort inverts the
# calibration leaderboard, and temperature (a fitted scalar, not a score) gets a winner.
#
# tools/validate.py cross-checks `vocabulary` against the constants exported into
# _data/registry.json, so a change upstream fails the build rather than silently
# rendering a metric the library never computes.

accuracy:               { label: "Acc.",        direction: higher, vocabulary: [single_label], precision: 3 }
precision:              { label: "Prec.",       direction: higher, vocabulary: [single_label, multi_label], precision: 3, averaging_sensitive: true }
recall:                 { label: "Recall",      direction: higher, vocabulary: [single_label, multi_label], precision: 3, averaging_sensitive: true }
f1:                     { label: "F1",          direction: higher, vocabulary: [single_label, multi_label], precision: 3, averaging_sensitive: true }
auroc:                  { label: "AUROC",       direction: higher, vocabulary: [single_label, multi_label], precision: 3 }
mcc:                    { label: "MCC",         direction: higher, vocabulary: [single_label], precision: 3 }
exact_match_accuracy:   { label: "Exact match", direction: higher, vocabulary: [multi_label], precision: 3 }
label_accuracy:         { label: "Label acc.",  direction: higher, vocabulary: [multi_label], precision: 3 }

ece:                    { label: "ECE",         direction: lower,  vocabulary: [single_label, multi_label], precision: 3, group: calibration }
adaptive_ece:           { label: "AECE",        direction: lower,  vocabulary: [single_label, multi_label], precision: 3, group: calibration }
mce:                    { label: "MCE",         direction: lower,  vocabulary: [single_label, multi_label], precision: 3, group: calibration }
brier:                  { label: "Brier",       direction: lower,  vocabulary: [single_label, multi_label], precision: 3, group: calibration }
temperature:            { label: "T",           direction: none,   vocabulary: [single_label, multi_label], precision: 3, group: calibration }
ece_temp:               { label: "ECE (T)",     direction: lower,  vocabulary: [single_label, multi_label], precision: 3, group: calibration }
adaptive_ece_temp:      { label: "AECE (T)",    direction: lower,  vocabulary: [single_label, multi_label], precision: 3, group: calibration }
mce_temp:               { label: "MCE (T)",     direction: lower,  vocabulary: [single_label, multi_label], precision: 3, group: calibration }
brier_temp:             { label: "Brier (T)",   direction: lower,  vocabulary: [single_label, multi_label], precision: 3, group: calibration }

# Specified by the journal protocol, NOT computed by deepecgkit. These render as the
# `metric_unimplemented` status inside the coverage matrix rather than as a blank or a
# missing column -- a known gap reads better than an absence.
auprc:                  { label: "AUPRC",       direction: higher, vocabulary: [], precision: 3, unimplemented: true }
specificity:            { label: "Spec.",       direction: higher, vocabulary: [], precision: 3, unimplemented: true }
balanced_accuracy:      { label: "Bal. acc.",   direction: higher, vocabulary: [], precision: 3, unimplemented: true }
ppv:                    { label: "PPV",         direction: higher, vocabulary: [], precision: 3, unimplemented: true }
npv:                    { label: "NPV",         direction: higher, vocabulary: [], precision: 3, unimplemented: true }
