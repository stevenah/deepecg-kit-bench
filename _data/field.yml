# The field survey: notable ECG deep-learning architectures NOT implemented in DeepECG-Kit.
#
# Hand-curated. Every fact here is AS REPORTED IN THE LITERATURE, never measured by this
# site -- which is why these entries live in a separate file with a separate vocabulary:
# tools/validate.py refuses a survey entry carrying a measured-fact key (params_total,
# feature_dim, ...), and refuses one whose slug matches a registered model. When an entry
# gets implemented upstream, the build fails until it is deleted here and written up as
# _models/<name>.md instead, so a model can never appear twice with two sets of facts.
#
# Identifier policy, same as _models/: a DOI or arXiv id appears only when we are certain
# of it. An invented identifier on a research site is worse than an absent one. Every
# identifier below was resolved against api.crossref.org or the arXiv API and the returned
# title matched against paper_title; anything that failed was dropped rather than guessed.
# Two traps worth remembering if you add a row: PMLR, NeurIPS and OpenReview mint no DOI,
# so those papers carry an arXiv id or nothing; and a plausible-looking guessed DOI usually
# resolves to a REAL but unrelated paper, which no gate here can detect.
#
# SCOPE. The survey covers the field, not only what this site benchmarks, so it includes
# delineation and generative models that could never hold a result cell. `family` names the
# architectural trunk, except for `segmentation` and `generative`, which name what the model
# outputs -- a positional map over samples, or a signal. Rows are ordered by family, then
# publication year, then slug.
#
# Sorted and emitted in bulk; keep new rows in family/year order.

